# Broker + storage for the e2e suite only (test/Compliance.Tests/E2E). This is deliberately
# separate from the root compose.yml, which is for running the whole app locally -- this file
# owns nothing but the two backing services the e2e tests need. BrokerStack assigns a distinct
# project name per fixture and discovers Docker's mapped HTTP port, so concurrent test processes
# and the root stack can run without sharing broker state.
#
# Lifecycle is owned by BrokerStack (BrokerStack.cs), not run by hand:
#   docker compose -p <unique-project> -f test/Compliance.Tests/E2E/compose.yml up -d
#   docker compose -p <unique-project> -f test/Compliance.Tests/E2E/compose.yml down --volumes

services:
  broker:
    image: ghcr.io/cntryl/fitz:0.2.0
    stop_signal: SIGINT
    stop_grace_period: 15s
    depends_on:
      - storage
    environment:
      FITZ_AUTH_REQUIRED: "false"
      FITZ_ADMIN_AUTH_MODE: open
      FITZ_HTTP_PORT: "4090"
      FITZ_TCP_PORT: "4091"
      FITZ_STORAGE_MODE: cloud
      FITZ_STORAGE_PROVIDER: sqrzl-s3
      FITZ_STORAGE_ENDPOINT: http://storage:9000
      FITZ_STORAGE_BUCKET: compliance-fitz-e2e
      FITZ_STORAGE_PREFIX: e2e
      FITZ_STORAGE_CACHE_PATH: /data/cache
      FITZ_STORAGE_CLOUD_DURABILITY: background
      RUST_LOG: info,fitz=info
    ports:
      - target: 4090
        host_ip: 127.0.0.1
        protocol: tcp

  storage:
    image: ghcr.io/sqrzl/sqrzl-emulator:latest@sha256:786d910514727d7e26a9c26266a2232cfbcd9b31609d088b08a473326dc22c16
    environment:
      SQRZL_BLOBS_PATH: /app/blobs
      SQRZL_ACCESS_KEY_ID: admin
      SQRZL_SECRET_ACCESS_KEY: sqrzl-secret
      SQRZL_BUCKET_LIST: compliance-fitz-e2e
