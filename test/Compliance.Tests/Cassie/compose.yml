name: compliance-cassie-tests

services:
  cassie:
    image: ghcr.io/cntryl/cassie@sha256:c179afabb7051e19629cfd1ecc6b83fa88bfb4deb6a391060aa1f472f7a0d1de
    init: true
    environment:
      CASSIE_STORAGE_MODE: memory
      CASSIE_ROOT_PASSWORD: compliance-cassie-test
      CASSIE_ALLOW_INSECURE_NON_LOOPBACK_LISTEN: "1"
    ports:
      - "127.0.0.1:${COMPLIANCE_CASSIE_TEST_PORT:-55432}:5432"
      - "127.0.0.1:${COMPLIANCE_CASSIE_TEST_HTTP_PORT:-58080}:8080"
    security_opt:
      - no-new-privileges:true
