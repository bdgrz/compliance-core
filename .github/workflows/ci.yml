name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Spec
        # Design catalogs stay self-consistent and the source tree does not drift from the selected design.
        run: |
          node --test tools/test/*.test.mjs
          node tools/validate-aggregate-spec.mjs
          node tools/check-implementation-coverage.mjs

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore Compliance.slnx --locked-mode

      - name: Format
        # The build enforces configured style and analyzer diagnostics.
        run: dotnet format whitespace Compliance.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Compliance.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Compliance.slnx --configuration Release --no-build --no-restore --filter "Category!=BrokerIntegration&Category!=WebIntegration"
