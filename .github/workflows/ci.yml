name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      Cassie__ConnectionString: Host=127.0.0.1;Port=55432;Database=postgres;Username=root;Password=compliance-cassie-test;SSL Mode=Disable;Timeout=15
      COMPLIANCE_CASSIE_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=55432;Database=postgres;Username=root;Password=compliance-cassie-test;SSL Mode=Disable;Timeout=15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.0

      - name: Spec
        # Validate the hand-authored proposal and runtime fixture separately. Backend tests enforce source and wire compatibility.
        run: |
          node --test tools/test/*.test.mjs
          node tools/validate-aggregate-spec.mjs
          node tools/check-implementation-coverage.mjs

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Compliance.slnx

      - name: Format
        # The build enforces configured style and analyzer diagnostics.
        run: dotnet format whitespace Compliance.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Compliance.slnx --configuration Release --no-restore

      - name: Test
        run: |
          docker compose -f test/Compliance.Tests/Cassie/compose.yml up -d
          curl --fail --silent --show-error --retry 30 --retry-delay 1 \
            --retry-connrefused --max-time 2 --output /dev/null http://127.0.0.1:58080/readyz
          dotnet test Compliance.slnx --configuration Release --no-build --no-restore --filter "Category!=BrokerIntegration&Category!=WebIntegration" -- xUnit.ParallelizeTestCollections=false

      - name: Stop Cassie test service
        if: ${{ always() }}
        run: docker compose -f test/Compliance.Tests/Cassie/compose.yml down
